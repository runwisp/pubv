name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for OIDC trusted publishing
        # Trusted publishing (no token; uses the id-token below) requires npm
        # >= 11.5.1. npm 12.x needs Node >= 22.22 / 24.15, so
        # this step runs on Node 24 (Node 20 is also deprecated on runners).
        run: npm install -g --ignore-scripts npm@12.2.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run typecheck
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Normalize package.json after version bump
        # `npm version` rewrites package.json with its own formatting (expanded
        # arrays), which biome rejects. Re-format so the prepublishOnly lint hook
        # invoked by `npm publish` does not fail on the bumped file.
        run: bun run format
      - run: bun run build
      - name: Configure test git identity
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          git config --global init.defaultBranch main
      - run: bun test
      - name: Publish to npm
        # Authentication comes from OIDC trusted publishing (id-token: write
        # above) configured for @runwisp/pubv on npmjs.com — no NPM_TOKEN needed.
        # --provenance is implied by trusted publishing but kept explicit.
        run: npm publish --provenance --access public
